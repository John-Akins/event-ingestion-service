name: Main branch deploy workflow

on: 
    # push:
    pull_request:
        branches: [main]

jobs: 
    build-app:
        name: Build and push docker image
        runs-on: ubuntu-latest

        outputs:
          image-tag: ${{ steps.generate-tag.outputs.image-tag }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup java
              uses: actions/setup-java@v4
              with:
                    distribution: temurin
                    java-version: 21
                    cache: maven 

            - name: Generate valid Docker tag (slugify branch name)
              id: generate-tag
              run: |
                    TAG=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
                    IMAGE_TAG="johnakins/n7b3v9c1x5z8a2-analytics-repo:event-ingestion-service-${TAG}"
                    echo "TAG=${TAG}" >> $GITHUB_ENV
                    echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
                    echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
 
            - name: Build with maven
              run: |
                    mvn clean
                    mvn -B package
            
            - name: Build docker image
              uses: docker/build-push-action@v4
              with: 
                    context: .
                    dockerfile: Dockerfile
                    push: false
                    tags: ${{ env.IMAGE_TAG }}

            - name: Login to docker hub
              uses: docker/login-action@v3
              with: 
                    username: ${{ secrets.DOCKER_HUB_USERNAME }}
                    password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Publish to docker hub
              uses: docker/build-push-action@v4
              with: 
                    context: .
                    dockerfile: Dockerfile
                    push: true
                    tags: ${{ env.IMAGE_TAG }}

    infra-provisioning:
        name: Provision AWS resources with terraform
        runs-on: ubuntu-latest
        needs: build-app

        outputs:
          ec2-ip: ${{ steps.terraform-outputs.outputs.ec2-ip }}
          rds-endpoint: ${{ steps.terraform-outputs.outputs.rds-endpoint }}

        defaults:
          run:
            working-directory: "infra"

        env:
          # Variables
          TF_VAR_region: ${{ vars.TF_VAR_REGION }}
          TF_VAR_default_vpc: ${{ vars.TF_VAR_DEFAULT_VPC }}
          TF_VAR_ec2_instance_type: ${{ vars.TF_VAR_EC2_INSTANCE_TYPE }}
          TF_VAR_rdsconfig_allocated_storage: ${{ vars.TF_VAR_RDSCONFIG_ALLOCATED_STORAGE }}
          TF_VAR_rdsconfig_engine: ${{ vars.TF_VAR_RDSCONFIG_ENGINE }}
          TF_VAR_rdsconfig_engine_version: ${{ vars.TF_VAR_RDSCONFIG_ENGINE_VERSION }}
          TF_VAR_rdsconfig_instance_class: ${{ vars.TF_VAR_RDSCONFIG_INSTANCE_CLASS }}
          TF_VAR_rdsconfig_storage_type: ${{ vars.TF_VAR_RDSCONFIG_STORAGE_TYPE }}
          TF_VAR_subnet_a: ${{ vars.TF_VAR_SUBNET_A }}
          TF_VAR_subnet_b: ${{ vars.TF_VAR_SUBNET_B }}
          # Secrets
          TF_VAR_rdsconfig_identifier: ${{ secrets.TF_VAR_RDSCONFIG_IDENTIFIER }}
          TF_VAR_rdsconfig_db_name: ${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
          TF_VAR_rdsconfig_username: ${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
          TF_VAR_rdsconfig_password: ${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }} 
          TF_VAR_ssh_private_key: ${{ secrets.TF_VAR_SSH_PRIVATE_KEY }}
          TF_VAR_ec2_ami: ${{ secrets.TF_VAR_EC2_AMI }}

        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
              sparse-checkout: "infra"
              sparse-checkout-cone-mode: false

          - name: Configure AWS credentials # not needed for tf, just passed those cred as env vars
            uses: aws-actions/configure-aws-credentials@v5.0.0
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ vars.TF_VAR_REGION }}

          - name: Terraform setup
            uses: hashicorp/setup-terraform@v3

          - name: Initialize terraform
            run: terraform init

          - name: Terraform plan
            run: terraform plan -no-color

          - name: Terraform apply
            run: terraform apply -auto-approve

          - name: Get terraform outputs
            id: terraform-outputs
            run: |
              echo "ec2-ip=$(terraform output -raw eis_ec2_ip)" >> $GITHUB_OUTPUT
              echo "rds-endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT

    deploy-app:
        name: Deploy docker app to EC2 instance
        runs-on: ubuntu-latest
        needs: [build-app, infra-provisioning]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Debug output access
              run: echo  ${{ needs.infra-provisioning.outputs.rds-endpoint }}

            - name: Deploy to EC2
              run: |
                echo "Deploying to EC2 instance at: ${{ needs.infra-provisioning.outputs.ec2-ip }}"
                echo "Using RDS endpoint: ${{ needs.infra-provisioning.outputs.rds-endpoint }}"

                # Setup SSH key for secure access to EC2
                mkdir -p ~/.ssh
                echo "${{ secrets.TF_VAR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                chmod 600 ~/.ssh/id_rsa
                ssh-keyscan -H ${{ needs.infra-provisioning.outputs.ec2-ip }} >> ~/.ssh/known_hosts

                # SSH access to EC2 instance
                ssh -i ~/.ssh/id_rsa ec2-user@${{ needs.infra-provisioning.outputs.ec2-ip }} << EOF
                  echo "Connected to EC2 instance"
                  echo "Using Docker image: ${{ needs.build-app.outputs.image-tag }}"
                  echo "RDS endpoint: ${{ needs.infra-provisioning.outputs.rds-endpoint }}"

                  # Setup docker
                  sudo yum update -y
                  sudo amazon-linux-extras install docker
                  sudo service docker start
                  sudo usermod -a -G docker ec2-user

                  # Setup docker-compose
                  sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.4/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                  sudo chmod +x /usr/local/bin/docker-compose

                  # Create environment file using here string
                  cat > .env <<< "SPRING_PROFILES_ACTIVE=prod
                AWS_RDS_HOSTNAME=${{ needs.infra-provisioning.outputs.rds-endpoint }}
                AWS_RDS_USERNAME=${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
                AWS_RDS_PASSWORD=${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }}
                AWS_RDS_DB_NAME=${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
                AWS_RDS_PORT=5432"

                  # Pull the latest Docker image
                  docker pull ${{ needs.build-app.outputs.image-tag }}

                  # Stop and remove existing container if running
                  docker stop event-ingestion-service || true
                  docker rm event-ingestion-service || true

                  # Run the new container
                  docker compose up -d
                  echo "Deployment completed successfully"
                EOF
