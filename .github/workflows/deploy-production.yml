name: Main branch deploy workflow

on: 
    # push:
    pull_request:
        branches: [main]

jobs: 
    build-app:
        name: Build and push docker image
        runs-on: ubuntu-latest

        outputs:
          image-tag-key: ${{ steps.generate-tag.outputs.image-tag-key }}

        permissions:
            id-token: write 
            contents: read           

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup java
              uses: actions/setup-java@v4
              with:
                    distribution: temurin
                    java-version: 21
                    cache: maven 

            - name: AWS OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_SECRET_MANAGER_ROLE_ARN }}
                aws-region: ${{ vars.TF_VAR_REGION }}

            - name: Generate valid Docker tag (slugify branch name)
              id: generate-tag
              run: |
                    TAG=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
                    IMAGE_TAG="johnakins/n7b3v9c1x5z8a2-analytics-repo:event-ingestion-service-${TAG}"
                    echo "TAG=${TAG}" >> $GITHUB_ENV
                    echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
                    IMAGE_TAG_KEY=${{ github.ref_name }}-image-tag-key
                    # 
                    aws secretsmanager delete-secret --secret-id "$IMAGE_TAG_KEY" --force-delete-without-recovery || true
                    aws secretsmanager create-secret --name "$IMAGE_TAG_KEY" --secret-string "$IMAGE_TAG"
                    echo "$IMAGE_TAG_KEY" > image-tag-key.txt

            - name: Upload image tag artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: image-tag-artifact
                path: image-tag-key.txt
                retention-days: 1

            - name: Build with maven
              run: |
                    mvn clean
                    mvn -B package
            
            - name: Build docker image
              uses: docker/build-push-action@v4
              with:
                    context: .
                    file: Dockerfile
                    push: false
                    tags: ${{ env.IMAGE_TAG }}

            - name: Login to docker hub
              uses: docker/login-action@v3
              with: 
                    username: ${{ secrets.DOCKER_HUB_USERNAME }}
                    password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Publish to docker hub
              uses: docker/build-push-action@v4
              with:
                    context: .
                    file: Dockerfile
                    push: true
                    tags: ${{ env.IMAGE_TAG }}

            - name: Clean up secrets on build failure
              if: failure()
              run: |
                  # Clean up secrets immediately on build failure
                  if [ -f image-tag-key.txt ]; then
                    IMAGE_TAG_KEY=$(cat image-tag-key.txt)
                    aws secretsmanager delete-secret --secret-id "$IMAGE_TAG_KEY" --force-delete-without-recovery || true
                  fi

    infra-provisioning:
        name: Provision AWS resources with terraform
        runs-on: ubuntu-latest
        needs: build-app

        permissions:
            id-token: write 
            contents: read           

        outputs:
          ec2-ip: ${{ steps.terraform-outputs.outputs.ec2-ip }}
          rds-endpoint-key: ${{ steps.terraform-outputs.outputs.rds-endpoint-key }}

        defaults:
          run:
            working-directory: "infra"

        env:
          # Variables
          TF_VAR_region: ${{ vars.TF_VAR_REGION }}
          TF_VAR_default_vpc: ${{ vars.TF_VAR_DEFAULT_VPC }}
          TF_VAR_ec2_instance_type: ${{ vars.TF_VAR_EC2_INSTANCE_TYPE }}
          TF_VAR_rdsconfig_allocated_storage: ${{ vars.TF_VAR_RDSCONFIG_ALLOCATED_STORAGE }}
          TF_VAR_rdsconfig_engine: ${{ vars.TF_VAR_RDSCONFIG_ENGINE }}
          TF_VAR_rdsconfig_engine_version: ${{ vars.TF_VAR_RDSCONFIG_ENGINE_VERSION }}
          TF_VAR_rdsconfig_instance_class: ${{ vars.TF_VAR_RDSCONFIG_INSTANCE_CLASS }}
          TF_VAR_rdsconfig_storage_type: ${{ vars.TF_VAR_RDSCONFIG_STORAGE_TYPE }}
          TF_VAR_subnet_a: ${{ vars.TF_VAR_SUBNET_A }}
          TF_VAR_subnet_b: ${{ vars.TF_VAR_SUBNET_B }}
          # Secrets
          TF_VAR_rdsconfig_identifier: ${{ secrets.TF_VAR_RDSCONFIG_IDENTIFIER }}
          TF_VAR_rdsconfig_db_name: ${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
          TF_VAR_rdsconfig_username: ${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
          TF_VAR_rdsconfig_password: ${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }} 
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_ec2_ami: ${{ secrets.TF_VAR_EC2_AMI }}

        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
              sparse-checkout: "infra"
              sparse-checkout-cone-mode: false

          - name: Configure AWS credentials # not needed for tf, just passed those cred as env vars
            uses: aws-actions/configure-aws-credentials@v5.0.0
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ vars.TF_VAR_REGION }}

          - name: Terraform setup
            uses: hashicorp/setup-terraform@v3

          - name: Initialize terraform
            run: terraform init

          - name: Terraform plan
            run: terraform plan -no-color

          - name: Terraform apply
            run: terraform apply -auto-approve

          - name: artifacts
            uses: actions/download-artifact@v4            

          - name: Upload rds endpoint artifact
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: rds-endpoint-artifact
              path: rds-endpoint-key.txt
              retention-days: 1

          - name: Get terraform outputs
            id: terraform-outputs
            run: |
              echo "ec2-ip=$(terraform output -raw eis_ec2_ip)" >> "$GITHUB_OUTPUT"
              value=$(terraform output -raw rds_endpoint)
              RDS_ENDPOINT_KEY=RDS_ENDPOINT_KEY-$(date +%s)-$RANDOM
              aws secretsmanager create-secret --name "$RDS_ENDPOINT_KEY" --secret-string "$value"
              echo "$RDS_ENDPOINT_KEY" > rds-endpoint-key.txt
              cat rds-endpoint-key.txt

          - name: Clean up secrets on infra failure
            if: failure()
            run: |
              if [ -f image-tag-artifact/image-tag-key.txt ]; then
                IMAGE_TAG_KEY=$(cat image-tag-artifact/image-tag-key.txt)
                aws secretsmanager delete-secret --secret-id "$IMAGE_TAG_KEY" --force-delete-without-recovery || true
              fi
              if [ -v $RDS_ENDPOINT_KEY ]; then
                aws secretsmanager delete-secret --secret-id "$RDS_ENDPOINT_KEY" --force-delete-without-recovery || true
              fi              

    deploy-app:
        name: Deploy docker app to EC2 instance
        runs-on: ubuntu-latest
        needs: [build-app, infra-provisioning]

        permissions:
            id-token: write 
            contents: read

        env: 
          EC2_IP: ${{ needs.infra-provisioning.outputs.ec2-ip }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: AWS OIDC 
              uses: aws-actions/configure-aws-credentials@v4
              with: 
                role-to-assume: ${{ secrets.AWS_SECRET_MANAGER_ROLE_ARN }}
                aws-region: ${{ vars.TF_VAR_REGION }}

            - name: Setup SSH Agent
              uses: webfactory/ssh-agent@v0.9.0
              with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: artifacts
              uses: actions/download-artifact@v4

            - name: Retrieve Secrets, AWS SecretsManager
              run: |
                # Validate key files exist and are not empty
                cat rds-endpoint-artifact/rds-endpoint-key.txt
                if [ ! -f image-tag-artifact/image-tag-key.txt ] || [ -z "$(cat image-tag-artifact/image-tag-key.txt)" ]; then echo "Error: IMAGE_TAG_KEY file is missing or empty"; exit 1; fi
                if [ ! -f rds-endpoint-artifact/rds-endpoint-key.txt ] || [ -z "$(cat rds-endpoint-artifact/rds-endpoint-key.txt)" ]; then echo "Error: RDS_ENDPOINT_KEY file is missing or empty"; exit 1; fi

                # Retrieve Secret Keys from artifacts
                IMAGE_TAG_KEY=$(cat image-tag-artifact/image-tag-key.txt)
                RDS_ENDPOINT_KEY=$(cat rds-endpoint-artifact/rds-endpoint-key.txt)

                # Retrieve Secret Values
                IMAGE_TAG=$(aws secretsmanager get-secret-value --secret-id "$IMAGE_TAG_KEY" --query SecretString --output text )
                RDS_ENDPOINT=$(aws secretsmanager get-secret-value --secret-id  "$RDS_ENDPOINT_KEY" --query SecretString --output text)

                # Validate secrets are not empty
                if [ -z "$RDS_ENDPOINT" ]; then echo "Error: RDS_ENDPOINT is empty"; exit 1; fi
                if [ -z "$IMAGE_TAG" ]; then echo "Error: IMAGE_TAG is empty"; exit 1; fi

            - name: Deploy to EC2
              run: |
                echo "Deploying to EC2 instance at: ${{ needs.infra-provisioning.outputs.ec2-ip }}"
                echo "Using RDS endpoint: "
                if [ -n "$RDS_ENDPOINT" ]; then echo "::add-mask::$RDS_ENDPOINT"; fi
                echo "and Docker Image Tag: "
                if [ -n "$IMAGE_TAG" ]; then echo "::add-mask::$IMAGE_TAG"; fi

                # SSH access to EC2 instance
                ssh ec2-user@${{ needs.infra-provisioning.outputs.ec2-ip }} << EOF
                  echo "Connected to EC2 instance"

                  # Setup docker
                  sudo yum update -y
                  sudo amazon-linux-extras install docker
                  sudo service docker start
                  sudo usermod -a -G docker ec2-user

                  # Setup docker-compose
                  sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.4/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                  sudo chmod +x /usr/local/bin/docker-compose

                  # Create environment file using here string
                  cat > .env <<< "
                SPRING_PROFILES_ACTIVE=prod
                AWS_RDS_HOSTNAME=$RDS_ENDPOINT
                AWS_RDS_USERNAME=${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
                AWS_RDS_PASSWORD=${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }}
                AWS_RDS_DB_NAME=${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
                AWS_RDS_PORT=${{ secrets.TF_VAR_RDSCONFIG_DB_PORT }}"

                  # Pull the latest Docker image
                  docker pull $IMAGE_TAG

                  # Stop and remove existing container if running
                  docker stop event-ingestion-service || true
                  docker rm event-ingestion-service || true

                  # Run the new container
                  docker compose up -d
                  echo "Deployment completed successfully"
                EOF

            - name: Clean up secrets on deploy failure
              if: always()
              run: |
                if [ -f image-tag-artifact/image-tag-key.txt ]; then
                  IMAGE_TAG_KEY=$(cat image-tag-artifact/image-tag-key.txt)
                  aws secretsmanager delete-secret --secret-id "$IMAGE_TAG_KEY" --force-delete-without-recovery || true
                fi

                if [ -f rds-endpoint-artifact/rds-endpoint-key.txt ]; then
                  RDS_ENDPOINT_KEY=$(cat rds-endpoint-artifact/rds-endpoint-key.txt)
                  aws secretsmanager delete-secret --secret-id "$RDS_ENDPOINT_KEY" --force-delete-without-recovery || true
                fi
