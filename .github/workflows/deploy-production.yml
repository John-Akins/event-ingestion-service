name: Main branch deploy workflow

on:
  # push:
  pull_request:
    branches: [main]

jobs:
  build-app:
    name: Build and push docker image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate valid Docker tag (slugify branch name)
        id: generate-tag
        run: |
          TAG=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ vars.DOCKER_REPO }}:event-ingestion-service-${TAG}"
          echo "DOCKER_IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "docker-image=${IMAGE}" >> $GITHUB_OUTPUT
          # Debug to check image output variable is being set
          echo "Docker Image: $IMAGE"
          # Save to file for artifact
          echo "$IMAGE" > docker-image.txt

      - name: Upload docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: docker-image.txt
          retention-days: 1

      - name: Build with maven
        run: |
          mvn clean
          mvn -B package

      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Publish to docker hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  infra-provisioning:
    name: Provision AWS resources with terraform
    runs-on: ubuntu-latest
    needs: build-app

    permissions:
      id-token: write
      contents: read

    outputs:
      ec2-ip: ${{ steps.terraform-outputs.outputs.ec2-ip }}

    defaults:
      run:
        working-directory: "infra"

    env:
      # Variables
      TF_VAR_region: ${{ vars.TF_VAR_REGION }}
      TF_VAR_default_vpc: ${{ vars.TF_VAR_DEFAULT_VPC }}
      TF_VAR_ec2_instance_type: ${{ vars.TF_VAR_EC2_INSTANCE_TYPE }}
      TF_VAR_rdsconfig_allocated_storage: ${{ vars.TF_VAR_RDSCONFIG_ALLOCATED_STORAGE }}
      TF_VAR_rdsconfig_engine: ${{ vars.TF_VAR_RDSCONFIG_ENGINE }}
      TF_VAR_rdsconfig_engine_version: ${{ vars.TF_VAR_RDSCONFIG_ENGINE_VERSION }}
      TF_VAR_rdsconfig_instance_class: ${{ vars.TF_VAR_RDSCONFIG_INSTANCE_CLASS }}
      TF_VAR_rdsconfig_storage_type: ${{ vars.TF_VAR_RDSCONFIG_STORAGE_TYPE }}
      TF_VAR_subnet_a: ${{ vars.TF_VAR_SUBNET_A }}
      TF_VAR_subnet_b: ${{ vars.TF_VAR_SUBNET_B }}
      # Secrets
      TF_VAR_rdsconfig_identifier: ${{ secrets.TF_VAR_RDSCONFIG_IDENTIFIER }}
      TF_VAR_rdsconfig_db_name: ${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
      TF_VAR_rdsconfig_username: ${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
      TF_VAR_rdsconfig_password: ${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
      TF_VAR_ec2_ami: ${{ secrets.TF_VAR_EC2_AMI }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: "infra"
          sparse-checkout-cone-mode: false

      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTION_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.TF_VAR_REGION }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      - name: Initialize terraform
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: artifacts
        uses: actions/download-artifact@v4

      - name: Get terraform outputs
        id: terraform-outputs
        run: |
          echo "ec2-ip=$(terraform output -raw eis_ec2_ip)" >> "$GITHUB_OUTPUT"
          value=$(terraform output -raw rds_endpoint)
          echo "rds-endpoint=$value" >> "$GITHUB_OUTPUT"
          # Save RDS endpoint to file for artifact
          echo "$value" > rds-endpoint.txt

      - name: Upload RDS endpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: rds-endpoint-artifact
          path: infra/rds-endpoint.txt
          retention-days: 1
 
  deploy-app:
    name: Deploy docker app to EC2 instance
    runs-on: ubuntu-latest
    needs: [build-app, infra-provisioning]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTION_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.TF_VAR_REGION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Read deployment values
        run: |
          DOCKER_IMAGE=$(cat docker-image-artifact/docker-image.txt)
          RDS_ENDPOINT=$(cat rds-endpoint-artifact/rds-endpoint.txt)
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> $GITHUB_ENV
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV

      - name: Debug values
        run: |
          echo "Docker Image: $DOCKER_IMAGE"
          echo "RDS Endpoint: $RDS_ENDPOINT"

      - name: Deploy to EC2
        shell: bash
        env:
          EC2_IP: ${{ needs.infra-provisioning.outputs.ec2-ip }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          RDS_ENDPOINT: ${{ env.RDS_ENDPOINT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AWS_RDS_USERNAME: ${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
          AWS_RDS_PASSWORD: ${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }}
          AWS_RDS_DB_NAME: ${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
          AWS_RDS_PORT: ${{ secrets.TF_VAR_RDSCONFIG_DB_PORT }}
        run: .github/scripts/deploy.sh
