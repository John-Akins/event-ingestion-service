name: Main branch deploy workflow

on:
  push:
    branches: [main]

jobs:
  build:
    name: 🚀 Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate valid Docker tag (slugify branch name)
        id: generate-tag
        run: |
          TAG=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ vars.DOCKER_REPO }}:event-ingestion-service-${TAG}"
          echo "DOCKER_IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "docker-image=${IMAGE}" >> $GITHUB_OUTPUT
          # Debug to check image output variable is being set
          echo "Docker Image: $IMAGE"
          # Save to file for artifact
          echo "$IMAGE" > docker-image.txt

      - name: Upload docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.txt
          retention-days: 1

      - name: Build with maven
        run: |
          mvn clean
          mvn -B package

      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Publish to docker hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  infra:
    name: 🏗️ Provision Infrastructure
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: "infra"

    env:
      # Variables
      TF_VAR_region: ${{ vars.TF_VAR_REGION }}
      TF_VAR_default_vpc: ${{ vars.TF_VAR_DEFAULT_VPC }}
      TF_VAR_ec2_instance_type: ${{ vars.TF_VAR_EC2_INSTANCE_TYPE }}
      TF_VAR_rdsconfig_allocated_storage: ${{ vars.TF_VAR_RDSCONFIG_ALLOCATED_STORAGE }}
      TF_VAR_rdsconfig_engine: ${{ vars.TF_VAR_RDSCONFIG_ENGINE }}
      TF_VAR_rdsconfig_engine_version: ${{ vars.TF_VAR_RDSCONFIG_ENGINE_VERSION }}
      TF_VAR_rdsconfig_instance_class: ${{ vars.TF_VAR_RDSCONFIG_INSTANCE_CLASS }}
      TF_VAR_rdsconfig_storage_type: ${{ vars.TF_VAR_RDSCONFIG_STORAGE_TYPE }}
      TF_VAR_subnet_a: ${{ vars.TF_VAR_SUBNET_A }}
      TF_VAR_subnet_b: ${{ vars.TF_VAR_SUBNET_B }}
      # Secrets
      TF_VAR_rdsconfig_identifier: ${{ secrets.TF_VAR_RDSCONFIG_IDENTIFIER }}
      TF_VAR_rdsconfig_db_name: ${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
      TF_VAR_rdsconfig_username: ${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
      TF_VAR_rdsconfig_password: ${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
      TF_VAR_ec2_ami: ${{ secrets.TF_VAR_EC2_AMI }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: "infra"
          sparse-checkout-cone-mode: false

      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTION_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.TF_VAR_REGION }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      - name: Initialize terraform
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: artifacts
        uses: actions/download-artifact@v4

      - name: Get terraform outputs
        id: terraform-outputs
        run: |
          ec2_ip=$(terraform output -raw eis_ec2_ip)
          # Save EC2 IP to file for artifact
          echo "$ec2_ip" > ec2-ip.txt
          value=$(terraform output -raw rds_endpoint)
          # Strip RDS port form host
          endpoint=$(echo "$value" | cut -d':' -f1)
          # Save RDS endpoint to file for artifact
          echo "$endpoint" > rds-endpoint.txt
          port=$(echo "$value" | cut -d':' -f2)
          # Save RDS port to file for artifact
          echo "$port" > rds-port.txt

      - name: Upload EC2 IP
        uses: actions/upload-artifact@v4
        with:
          name: ec2-ip
          path: infra/ec2-ip.txt
          retention-days: 1

      - name: Upload RDS endpoint
        uses: actions/upload-artifact@v4
        with:
          name: rds-endpoint
          path: infra/rds-endpoint.txt
          retention-days: 1
      
      - name: Upload RDS port
        uses: actions/upload-artifact@v4
        with:
          name: rds-port
          path: infra/rds-port.txt
          retention-days: 1
 
  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    needs: [build, infra]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTION_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.TF_VAR_REGION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Load deployment values
        run: |
          DOCKER_IMAGE=$(cat docker-image/docker-image.txt)
          RDS_ENDPOINT=$(cat rds-endpoint/rds-endpoint.txt)
          EC2_IP=$(cat ec2-ip/ec2-ip.txt)
          AWS_RDS_PORT=$(cat rds-port/rds-port.txt)
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> $GITHUB_ENV
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
          echo "AWS_RDS_PORT=$AWS_RDS_PORT" >> $GITHUB_ENV

      - name: Deploy to EC2
        shell: bash
        env:
          TF_VAR_REGION: ${{ vars.TF_VAR_REGION }}
          EC2_IP: ${{ env.EC2_IP }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          RDS_ENDPOINT: ${{ env.RDS_ENDPOINT }}
          AWS_RDS_USERNAME: ${{ secrets.TF_VAR_RDSCONFIG_USERNAME }}
          AWS_RDS_PASSWORD: ${{ secrets.TF_VAR_RDSCONFIG_PASSWORD }}
          AWS_RDS_DB_NAME: ${{ secrets.TF_VAR_RDSCONFIG_DB_NAME }}
          AWS_RDS_PORT: ${{ env.AWS_RDS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: .github/scripts/deploy.sh
