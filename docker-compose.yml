services:
  app:
    image: ${DOCKER_IMAGE}
    ports:
      - "8085:8085"
      - "4040:4040"
    volumes:
      - /logs:/logs
    dns:
      - 8.8.8.8 # dns resolution issue fix
    environment:
      SPRING_PROFILES_ACTIVE: $SPRING_PROFILES_ACTIVE
      DATABASE_URL: "jdbc:postgresql://${DB_HOSTNAME}:${DB_PORT}/${DB_NAME}"
      DATABASE_USERNAME: "$DB_USERNAME"
      DATABASE_PASSWORD: "$DB_PASSWORD"
